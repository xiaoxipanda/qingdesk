name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: |
          swift --version
          python3 --version
      - name: Unit tests
        run: swift test
      - name: Build and package app
        run: bash scripts/build-app.sh
      - name: Verify archive extraction
        run: |
          unzip -q dist/QingDesk-macOS.zip -d .build/archive-check
          test -x ".build/archive-check/轻桌.app/Contents/MacOS/DesktopWorkbench"
          codesign --verify --deep --strict ".build/archive-check/轻桌.app"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: QingDesk-${{ runner.arch }}
          path: dist/QingDesk-macOS.zip
          if-no-files-found: error
          retention-days: 14
